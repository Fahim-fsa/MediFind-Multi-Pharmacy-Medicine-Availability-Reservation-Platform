<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reset password')}"></head>
<body>
<div th:replace="~{fragments/layout :: publicNav}"></div>

<div class="auth-shell">
    <div class="container-narrow auth-card">
        <div class="card">
            <h2>Choose a new password</h2>
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <form th:action="@{/auth/reset-password}" th:object="${resetPasswordRequest}" method="post">
                <input type="hidden" th:field="*{token}"/>
                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <input type="password" id="newPassword" th:field="*{newPassword}" required autofocus/>
                    <div class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm new password</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required/>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Update password</button>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
