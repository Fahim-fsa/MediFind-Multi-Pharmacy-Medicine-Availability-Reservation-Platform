<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forgot password')}"></head>
<body>
<div th:replace="~{fragments/layout :: publicNav}"></div>

<div class="auth-shell">
    <div class="container-narrow auth-card">
        <div class="card">
            <h2>Reset your password</h2>
            <p class="text-sm text-muted">Enter the email on your account and we'll send a reset link.</p>
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <form th:action="@{/auth/forgot-password}" th:object="${forgotPasswordRequest}" method="post">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" required autofocus/>
                    <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
            </form>

            <p class="text-sm text-muted" style="margin-top:16px;"><a th:href="@{/auth/login}">Back to sign in</a></p>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
