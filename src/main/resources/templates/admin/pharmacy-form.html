<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${formTitle})}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebarAdmin('listings')}"></div>
    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar(${formTitle}, '/admin/listings')}"></div>
        <div class="content-body">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="card" style="max-width:520px;">
                <form th:action="@{${formAction}}" method="post">
                    <div class="form-group">
                        <label for="pharmacyName">Pharmacy name</label>
                        <input type="text" id="pharmacyName" name="pharmacyName"
                               th:value="${pharmacyAdminRequest.pharmacyName}" required/>
                    </div>
                    <div class="form-group">
                        <label for="licenseNumber">License number</label>
                        <input type="text" id="licenseNumber" name="licenseNumber"
                               th:value="${pharmacyAdminRequest.licenseNumber}" required/>
                    </div>
                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" name="address"
                               th:value="${pharmacyAdminRequest.address}" required/>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="latitude">Latitude</label>
                            <input type="number" step="0.000001" id="latitude" name="latitude"
                                   th:value="${pharmacyAdminRequest.latitude}" required/>
                        </div>
                        <div class="form-group">
                            <label for="longitude">Longitude</label>
                            <input type="number" step="0.000001" id="longitude" name="longitude"
                                   th:value="${pharmacyAdminRequest.longitude}" required/>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" name="phone"
                               th:value="${pharmacyAdminRequest.phone}" required/>
                    </div>
                    <div class="form-group">
                        <label for="openingHours">Opening hours</label>
                        <input type="text" id="openingHours" name="openingHours"
                               th:value="${pharmacyAdminRequest.openingHours}"
                               placeholder="e.g. 9:00 AM - 10:00 PM, 7 days"/>
                    </div>
                    <div class="flex gap-12">
                        <button type="submit" class="btn btn-primary" th:text="${submitLabel}">Save</button>
                        <a th:href="@{/admin/listings}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
