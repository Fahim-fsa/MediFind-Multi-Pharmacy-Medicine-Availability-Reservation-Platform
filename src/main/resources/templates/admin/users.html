<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Users')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebarAdmin('users')}"></div>
    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar('Patient accounts', '/admin/dashboard')}"></div>
        <div class="content-body">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="card" style="margin-bottom:18px;">
                <form th:action="@{/admin/users}" method="get" class="flex gap-12" style="flex-wrap:wrap; align-items:flex-end;">
                    <div class="form-group mb-0" style="flex:1; min-width:200px;">
                        <label for="search">Search name or email</label>
                        <input type="search" id="search" name="search" th:value="${search}"/>
                    </div>
                    <div class="form-group mb-0">
                        <label for="status">Status</label>
                        <select id="status" name="status">
                            <option value="">All</option>
                            <option value="ACTIVE" th:selected="${status != null and status.name() == 'ACTIVE'}">Active</option>
                            <option value="SUSPENDED" th:selected="${status != null and status.name() == 'SUSPENDED'}">Suspended</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-secondary">Filter</button>
                </form>
            </div>

            <div class="card">
                <div class="table-wrap" th:if="${not #lists.isEmpty(users.content)}">
                    <table>
                        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Joined</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="u : ${users.content}">
                            <td th:text="${u.fullName}">Jane Doe</td>
                            <td th:text="${u.email}">jane@example.com</td>
                            <td th:text="${u.phone}">+880...</td>
                            <td>
                                <span class="badge badge-success" th:if="${u.status.name() == 'ACTIVE'}">Active</span>
                                <span class="badge badge-danger" th:if="${u.status.name() == 'SUSPENDED'}">Suspended</span>
                            </td>
                            <td th:text="${#temporals.format(u.createdAt, 'dd MMM yyyy')}">Today</td>
                            <td>
                                <form th:action="@{/admin/users/{id}/suspend(id=${u.id})}" method="post" th:if="${u.status.name() == 'ACTIVE'}">
                                    <button type="submit" class="btn btn-danger btn-sm">Suspend</button>
                                </form>
                                <form th:action="@{/admin/users/{id}/activate(id=${u.id})}" method="post" th:if="${u.status.name() == 'SUSPENDED'}">
                                    <button type="submit" class="btn btn-primary btn-sm">Reactivate</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="empty-state" th:if="${#lists.isEmpty(users.content)}"><p>No matching patients.</p></div>

                <div class="pagination" th:if="${users.totalPages > 1}">
                    <span th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}">
                        <span th:if="${i == users.number}" class="current" th:text="${i + 1}">1</span>
                        <a th:unless="${i == users.number}" th:href="@{/admin/users(page=${i}, status=${status}, search=${search})}" th:text="${i + 1}">2</a>
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
