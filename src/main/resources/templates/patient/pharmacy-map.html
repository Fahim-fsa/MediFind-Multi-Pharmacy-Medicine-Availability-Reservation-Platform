<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pharmacy map')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebarPatient('map')}"></div>
    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar('Pharmacy map', '/patient/notifications')}"></div>
        <div class="content-body">
            <div th:replace="~{fragments/layout :: alerts}"></div>
            <div class="card">
                <p class="text-sm text-muted mt-0" id="mapIntro">Every verified pharmacy currently on MediFind. Click a pin for its address and hours.</p>
                <div id="pharmacy-map"></div>
            </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
      integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw=="
      crossorigin="anonymous" referrerpolicy="no-referrer"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
        integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:src="@{/js/map.js}"></script>
</body>
</html>
