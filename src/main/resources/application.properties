# ================================================================
# MediFind — Base configuration (shared by every profile/environment)
#
# SLP: Core Platform & Shared Engine
# Story: "Set up 3-tier project skeleton (Spring Boot, MVC, REST)"
#
# Spring Boot loads this file first, then layers the active profile's
# file (application-dev.properties / application-prod.properties) on
# top of it, overriding only what that profile needs to change.
# This satisfies the backlog item:
#   "Set up CI pipeline and environment configs" — separate profiles
#   for development, staging, and production.
# ================================================================

spring.application.name=medifind

# Which profile runs by default when you don't pass one explicitly.
# Change to "prod" (or pass -Dspring.profiles.active=prod) when deploying.
spring.profiles.active=dev

# ---------------------------------------------------------------
# Thymeleaf (server-rendered HTML views)
# ---------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ---------------------------------------------------------------
# File upload limits (not core to MVP, kept generous but bounded)
# ---------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Where uploaded medicine photos are saved (see FileStorageService /
# WebMvcConfig) — a plain folder on disk, deliberately outside the jar,
# so uploads survive a rebuild/redeploy. Relative paths are resolved
# against the working directory the app is started from; point this at
# an absolute path in production instead.
medifind.uploads.dir=uploads

# ---------------------------------------------------------------
# Session behaviour
# SLP: Admin Account & Verification Mgmt → "Admin session timeout after inactivity"
# Applies to every logged-in user (patient, pharmacist, admin) since
# they all share the same HttpSession mechanism.
# ---------------------------------------------------------------
server.servlet.session.timeout=30m

# ---------------------------------------------------------------
# Jackson (JSON responses from ApiController, e.g. the map endpoint)
# ---------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------------------------------------------------------------
# MediFind-specific business rules (custom properties, read via
# @Value in the services below). Keeping these here — instead of
# hard-coding numbers inside service classes — is what lets an
# admin-configurable override in SystemSetting take precedence at
# runtime while still having a safe default if no override exists.
# ---------------------------------------------------------------
# How long a RESERVED reservation stays valid before it auto-expires.
medifind.reservation.pickup-window-hours=24
# How often the auto-expiry background job runs.
medifind.reservation.expiry-check-interval-ms=900000
# Stock level at/below which a pharmacist gets a low-stock notification.
medifind.inventory.low-stock-threshold=5
# How many failed login attempts are allowed before a temporary lock.
medifind.security.max-login-attempts=5
medifind.security.lockout-minutes=15
# How long an admin MFA one-time code stays valid.
medifind.security.mfa-code-valid-minutes=5

# ---------------------------------------------------------------
# Actuator — lightweight, built-in monitoring endpoints.
# SLP: Platform Security & Compliance → "System monitoring & threat protection"
# Exposes only /actuator/health and /actuator/info publicly; the rest
# stay closed. This is deliberately minimal for a course project —
# a production deployment would put a real APM/monitoring stack in
# front of it instead.
# ---------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
