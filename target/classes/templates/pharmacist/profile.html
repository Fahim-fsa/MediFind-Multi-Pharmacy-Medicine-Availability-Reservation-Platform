<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pharmacy profile')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebarPharmacist('profile')}"></div>
    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar('Pharmacy profile', '/pharmacist/notifications')}"></div>
        <div class="content-body">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="card" style="max-width:520px;">
                <div class="flex-between" style="margin-bottom:14px;">
                    <span class="badge badge-success" th:if="${pharmacy.verificationStatus.name() == 'APPROVED'}">✓ Verified</span>
                    <span class="badge badge-warning" th:if="${pharmacy.verificationStatus.name() == 'PENDING'}">Pending review</span>
                    <span class="badge badge-danger" th:if="${pharmacy.verificationStatus.name() == 'REJECTED'}">Rejected</span>
                    <span class="text-sm text-muted">License: <span th:text="${pharmacy.licenseNumber}">LIC-000</span></span>
                </div>
                <form th:action="@{/pharmacist/profile}" method="post">
                    <div class="form-group">
                        <label for="pharmacyName">Pharmacy name</label>
                        <input type="text" id="pharmacyName" name="pharmacyName" th:value="${pharmacy.pharmacyName}" required/>
                    </div>
                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" name="address" th:value="${pharmacy.address}" required/>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="latitude">Latitude</label>
                            <input type="number" step="0.000001" id="latitude" name="latitude" th:value="${pharmacy.latitude}" required/>
                        </div>
                        <div class="form-group">
                            <label for="longitude">Longitude</label>
                            <input type="number" step="0.000001" id="longitude" name="longitude" th:value="${pharmacy.longitude}" required/>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" name="phone" th:value="${pharmacy.phone}" required/>
                    </div>
                    <div class="form-group">
                        <label for="openingHours">Opening hours</label>
                        <input type="text" id="openingHours" name="openingHours" th:value="${pharmacy.openingHours}"/>
                    </div>
                    <button type="submit" class="btn btn-primary">Save changes</button>
                </form>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
