<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(pageTitle='Sign in')}"></head>
<body>
<div th:replace="~{fragments/layout :: publicNav}"></div>

<div class="auth-shell">
    <div class="container-narrow auth-card">
        <div class="card">
            <h2>Sign in to MediFind</h2>
            <p class="text-muted text-sm">Patients and pharmacy staff sign in here. <a th:href="@{/auth/admin-login}">Admin? Go to the Admin Portal.</a></p>

            <div th:replace="~{fragments/layout :: alerts}"></div>

            <form th:action="@{/auth/login}" method="post">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" th:value="${email}" required autofocus/>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required/>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign in</button>
            </form>

            <p class="text-sm" style="margin-top:16px;">
                <a th:href="@{/auth/forgot-password}">Forgot your password?</a>
            </p>
            <p class="text-sm text-muted">
                New to MediFind? <a th:href="@{/auth/register}">Create an account</a>
            </p>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
