<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My profile')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebarPatient('profile')}"></div>
    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar('My profile', '/patient/notifications')}"></div>
        <div class="content-body">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="card" style="max-width:480px;">
                <form th:action="@{/patient/profile}" method="post">
                    <div class="form-group">
                        <label for="fullName">Full name</label>
                        <input type="text" id="fullName" name="fullName" th:value="${patient.fullName}" required/>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" th:value="${patient.email}" disabled/>
                        <div class="form-hint">Email cannot be changed — it's how you sign in.</div>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone number</label>
                        <input type="tel" id="phone" name="phone" th:value="${patient.phone}" required/>
                    </div>
                    <button type="submit" class="btn btn-primary">Save changes</button>
                </form>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
